<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Atlantis Ultimate Edition</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }

        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .screen {
            background: rgba(10, 15, 30, 0.95);
            padding: 15px;
            border: 2px solid #00ffff;
            text-align: center;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 80%;
            box-shadow: 0 5px 20px rgba(0, 255, 255, 0.3);
            border-radius: 4px;
        }

        h1 {
            color: #ffffff;
            margin: 0 0 8px 0;
            font-size: 14px;
            text-transform: uppercase;
            text-shadow: 0 2px 0 #00ffff, 0 4px 0 #0088aa;
            letter-spacing: 2px;
        }

        p {
            color: #aae0ff;
            font-size: 10px;
            margin-bottom: 15px;
            line-height: 1.4;
            font-weight: bold;
        }

        button {
            background: #001122;
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 8px 20px;
            font-size: 10px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: 0 3px 0 #0088aa;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #0088aa;
            background: #00ffff;
            color: #000;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000000;
            pointer-events: none;
            z-index: 5;
        }
        
        .hud-left, .hud-right, .hud-center {
            display: flex;
            flex-direction: column;
        }
        
        .hud-center { align-items: center; }
        .hud-right { align-items: flex-end; }

        .ammoContainer {
            width: 80px;
            height: 8px;
            border: 1px solid #ffffff;
            background: rgba(0,0,0,0.5);
            margin-top: 3px;
        }

        #ammoBar {
            width: 100%;
            height: 100%;
            background: #00ffff;
            transition: width 0.1s;
        }
        
        .timeDisplay { color: #ffff00; font-size: 9px; }
        .damageDisplay { color: #ff5555; margin-top: 3px; }
        .levelDisplay { color: #55ff55; font-size: 12px; margin-bottom: 3px;}
        .powerupDisplay { color: #ffaa00; font-size: 9px; margin-top: 3px; text-transform: uppercase;}

        #levelTransition {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            color: #ffffff;
            text-shadow: 0 0 10px #00ffff;
            display: none;
            z-index: 20;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="hud" style="display: none;">
            <div class="hud-left">
                <div>SCORE: <span id="scoreVal">0</span></div>
                <div class="timeDisplay" id="timeVal">DAY</div>
                <div class="damageDisplay">CITY DAMAGE: <span id="damageVal">0</span>%</div>
            </div>
            <div class="hud-center">
                <div class="levelDisplay" id="levelVal">WAVE 1</div>
                <div class="powerupDisplay" id="powerupVal"></div>
            </div>
            <div class="hud-right">
                <div>AMMO</div>
                <div class="ammoContainer"><div id="ammoBar"></div></div>
            </div>
        </div>

        <div id="levelTransition">WAVE COMPLETE<br><span style="font-size:10px; color:#55ff55;">REGENERATING CITY...</span></div>

        <div id="uiLayer">
            <div id="startScreen" class="screen">
                <h1>Atlantis Ultimate Edition</h1>
                <p>Tap to fire. Shoot powerups to equip them.<br>Intercept bombs, survive the death rays, defend the city.</p>
                <button id="startBtn">ENGAGE SYSTEM</button>
            </div>

            <div id="gameOverScreen" class="screen" style="display: none;">
                <h1 style="color: #ff3333; text-shadow: 0 2px 0 #880000;">CITY ANNIHILATED</h1>
                <p style="color: #ffffff; font-size: 12px;">FINAL SCORE: <span id="finalScoreDisplay">0</span></p>
                <button id="restartBtn">RESTART SIMULATION</button>
            </div>
        </div>
    </div>

<script>
const Audio = {
    ctx: null,
    masterGain: null,
    
    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.25;
            this.masterGain.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    },

    playShoot(type = 'default') {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        
        if (type === 'laser') {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.1);
            osc.frequency.linearRampToValueAtTime(300, now + 0.3);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.4, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.connect(gain); gain.connect(this.masterGain);
            osc.start(now); osc.stop(now + 0.3);
            
        } else if (type === 'shotgun') {
            // Loud Pow Blast
            const blastDur = 0.3;
            const blastSize = this.ctx.sampleRate * blastDur;
            const blastBuffer = this.ctx.createBuffer(1, blastSize, this.ctx.sampleRate);
            const bData = blastBuffer.getChannelData(0);
            for (let i = 0; i < blastSize; i++) bData[i] = Math.random() * 2 - 1;
            const noise = this.ctx.createBufferSource();
            noise.buffer = blastBuffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1200, now);
            filter.frequency.exponentialRampToValueAtTime(40, now + blastDur);
            const nGain = this.ctx.createGain();
            nGain.gain.setValueAtTime(1.5, now);
            nGain.gain.exponentialRampToValueAtTime(0.01, now + blastDur);
            noise.connect(filter).connect(nGain).connect(this.masterGain);
            noise.start(now);

            // Custom Rack Mechanism
            const start = now + 0.2; 
            
            const hit = (time, freq, q, gainVal, dur) => {
                const osc = this.ctx.createOscillator();
                osc.type = 'square';
                const bp = this.ctx.createBiquadFilter();
                bp.type = 'bandpass';
                bp.frequency.value = freq;
                bp.Q.value = q;
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(0.001, time);
                g.gain.exponentialRampToValueAtTime(gainVal, time + 0.01);
                g.gain.exponentialRampToValueAtTime(0.001, time + dur);
                osc.connect(bp).connect(g).connect(this.masterGain);
                osc.start(time); osc.stop(time + dur);
            };

            const scrapeDur = 0.5;
            const scrapeBuffer = this.ctx.createBuffer(1, this.ctx.sampleRate * scrapeDur, this.ctx.sampleRate);
            const sData = scrapeBuffer.getChannelData(0);
            for (let i = 0; i < scrapeBuffer.length; i++) sData[i] = Math.random() * 2 - 1;

            // Unlock after recoil
            hit(start, 3200, 12, 0.9, 0.03);

            // Pump backward (metal scrape)
            const back = this.ctx.createBufferSource();
            back.buffer = scrapeBuffer;
            const bp1 = this.ctx.createBiquadFilter();
            bp1.type = "bandpass";
            bp1.frequency.setValueAtTime(1700, start);
            bp1.frequency.linearRampToValueAtTime(900, start + 0.14);
            const g1 = this.ctx.createGain();
            g1.gain.setValueAtTime(0.0001, start + 0.01);
            g1.gain.exponentialRampToValueAtTime(0.45, start + 0.03);
            g1.gain.exponentialRampToValueAtTime(0.0001, start + 0.16);
            back.connect(bp1).connect(g1).connect(this.masterGain);
            back.start(start + 0.01);

            // Pump forward
            const forward = this.ctx.createBufferSource();
            forward.buffer = scrapeBuffer;
            const bp2 = this.ctx.createBiquadFilter();
            bp2.type = "bandpass";
            bp2.frequency.setValueAtTime(1000, start + 0.16);
            bp2.frequency.linearRampToValueAtTime(1800, start + 0.28);
            const g2 = this.ctx.createGain();
            g2.gain.setValueAtTime(0.0001, start + 0.16);
            g2.gain.exponentialRampToValueAtTime(0.42, start + 0.18);
            g2.gain.exponentialRampToValueAtTime(0.0001, start + 0.30);
            forward.connect(bp2).connect(g2).connect(this.masterGain);
            forward.start(start + 0.16);

            // Heavy bolt slam
            hit(start + 0.30, 1800, 10, 1.3, 0.07);

        } else if (type === 'flak') {
            // Very Loud, Deep Boom
            const dur = 0.4;
            const gain = this.ctx.createGain();
            const bufferSize = this.ctx.sampleRate * dur;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1500, now);
            filter.frequency.exponentialRampToValueAtTime(40, now + dur);
            gain.gain.setValueAtTime(3.0, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + dur);
            noise.connect(filter); filter.connect(gain); gain.connect(this.masterGain);
            noise.start(now);
            
            const thudOsc = this.ctx.createOscillator();
            thudOsc.type = 'square';
            thudOsc.frequency.setValueAtTime(100, now);
            thudOsc.frequency.exponentialRampToValueAtTime(20, now + dur);
            const thudGain = this.ctx.createGain();
            thudGain.gain.setValueAtTime(2.0, now);
            thudGain.gain.exponentialRampToValueAtTime(0.01, now + dur);
            thudOsc.connect(thudGain); thudGain.connect(this.masterGain);
            thudOsc.start(now); thudOsc.stop(now + dur);
            
        } else if (type === 'homing') {
            const dur = 0.6;
            const bufferSize = this.ctx.sampleRate * dur;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(100, now);
            filter.frequency.exponentialRampToValueAtTime(2500, now + dur);
            filter.Q.value = 1.5;
            const nGain = this.ctx.createGain();
            nGain.gain.setValueAtTime(0, now);
            nGain.gain.linearRampToValueAtTime(0.8, now + dur * 0.4);
            nGain.gain.linearRampToValueAtTime(0.01, now + dur);
            noise.connect(filter); filter.connect(nGain); nGain.connect(this.masterGain);
            noise.start(now);
            
        } else {
            // Default Cannon
            const dur = 0.15;
            const gain = this.ctx.createGain();
            const bufferSize = this.ctx.sampleRate * dur;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2500, now);
            filter.frequency.exponentialRampToValueAtTime(100, now + dur);
            gain.gain.setValueAtTime(0.7, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + dur);
            noise.connect(filter); filter.connect(gain); gain.connect(this.masterGain);
            noise.start(now);
        }
    },

    playLazerBuzz() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(80, now);
        osc.frequency.linearRampToValueAtTime(50, now + 0.1);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain); gain.connect(this.masterGain);
        osc.start(now); osc.stop(now + 0.1);
    },

    playExplosion(isLarge = false) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const dur = isLarge ? 0.8 : 0.25;
        const bufferSize = this.ctx.sampleRate * dur;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(isLarge ? 500 : 2000, now);
        filter.frequency.exponentialRampToValueAtTime(50, now + dur);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(isLarge ? 1 : 0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + dur);
        noise.connect(filter); filter.connect(gain); gain.connect(this.masterGain);
        noise.start(now);
    },

    playAlarm() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const playTone = (time) => {
            const osc = this.ctx.createOscillator();
            osc.type = 'square';
            osc.frequency.setValueAtTime(120, time);
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.4, time);
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.15);
            osc.connect(gain); gain.connect(this.masterGain);
            osc.start(time); osc.stop(time + 0.15);
        };
        playTone(now); playTone(now + 0.15); playTone(now + 0.3);
    },

    playChirp() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(2000 + Math.random()*1000, now);
        osc.frequency.exponentialRampToValueAtTime(4000 + Math.random()*1000, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain); gain.connect(this.masterGain);
        osc.start(now); osc.stop(now + 0.1);
    },

    playPowerup() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.1);
        osc.frequency.linearRampToValueAtTime(1200, now + 0.2);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.connect(gain); gain.connect(this.masterGain);
        osc.start(now); osc.stop(now + 0.3);
    },
    
    playShipSpawn(type) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        if (type === 5) { osc.type = 'square'; osc.frequency.setValueAtTime(1200, now); }
        else { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); }
        osc.frequency.linearRampToValueAtTime(osc.frequency.value * 0.5, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain); gain.connect(this.masterGain);
        osc.start(now); osc.stop(now + 0.2);
    }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
let L_WIDTH = 800;
let L_HEIGHT = 450; 

const bgCanvas = document.createElement('canvas');
const bgCtx = bgCanvas.getContext('2d', { alpha: false });
const cityCanvas = document.createElement('canvas');
const cityCtx = cityCanvas.getContext('2d', { willReadFrequently: true });

const PALETTES = {
    DAWN: { skyTop: '#1a1025', skyBot: '#ff7755' },
    DAY: { skyTop: '#1166aa', skyBot: '#88ccff' },
    SUNSET: { skyTop: '#441133', skyBot: '#ff3355' },
    NIGHT: { skyTop: '#050511', skyBot: '#111133' }
};

let currentToD = 'NIGHT';
let pal = PALETTES[currentToD];

const SPR_PAL = {
    0: 'transparent', 1: '#111111', 2: '#556677', 3: '#99aabb', 4: '#ff3333', 5: '#00ffff', 6: '#ffffff', 7: '#ffaa00'
};

function compileSprite(mapStr, scale = 3) {
    const lines = mapStr.trim().split('\n');
    const h = lines.length;
    const w = Math.max(...lines.map(l => l.length));
    const c = document.createElement('canvas');
    c.width = w * scale; c.height = h * scale;
    const cx = c.getContext('2d');
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < lines[y].length; x++) {
            const char = lines[y][x];
            if (char !== ' ' && char !== '0') {
                cx.fillStyle = SPR_PAL[char];
                cx.fillRect(x * scale, y * scale, scale, scale);
            }
        }
    }
    return c;
}

let gameState = 'MENU';
let lastTime = 0;
let globalTime = 0;
let score = 0;

let bgFlashTimer = 0;

let currentWave = 1;
let waveTimer = 0;

let gameOverAnimTimer = 0;

const MAX_AMMO = 200;
let ammo = MAX_AMMO;

let currentWeapon = 'default';

let cityShieldTimer = 0;

let shells = [];

let currentCityPixels = 0;

function updateCannons() {
    if (!cannons || cannons.length === 0) return;
    const isPortrait = L_HEIGHT > L_WIDTH;
    if (isPortrait) {
        cannons[0].x = L_WIDTH * 0.33;
        cannons[1].x = L_WIDTH * 0.67;
        cannons[2].isHidden = true; 
    } else {
        cannons[0].x = L_WIDTH * 0.25;
        cannons[1].x = L_WIDTH * 0.50;
        cannons[2].x = L_WIDTH * 0.75;
        cannons[2].isHidden = false;
    }
    cannons.forEach(c => c.y = groundY);
}

function resize() {
    const ww = window.innerWidth || 800;
    const wh = window.innerHeight || 450;
    const area = 800 * 450;
    const ratio = ww / Math.max(1, wh); 
    
    L_HEIGHT = Math.floor(Math.sqrt(area / ratio));
    L_WIDTH = Math.floor(L_HEIGHT * ratio);
    
    canvas.width = L_WIDTH; 
    canvas.height = L_HEIGHT;
    groundY = L_HEIGHT * (380/450);

    ctx.imageSmoothingEnabled = false;

    if (gameState !== 'GAMEOVER_ANIM') {
        bgCanvas.width = L_WIDTH; bgCanvas.height = L_HEIGHT;
        cityCanvas.width = L_WIDTH; cityCanvas.height = L_HEIGHT;
        generateBackground();
        generateDestructibleCity();
        
        if (cityDamage > 0.5 && (gameState === 'PLAYING' || isWaveTransition)) {
            let targetPixels = initialCityPixels * (1.0 - (cityDamage / 100.0));
            let attempts = 0;
            while (currentCityPixels > targetPixels && attempts < 1500) {
                carveCity(Math.random() * L_WIDTH, groundY - Math.random() * 30, 4 + Math.random() * 10);
                attempts++;
            }
        }
        
        updateCannons();
        pedestrians.forEach(p => p.y = groundY - 5);
        vehicles.forEach(v => v.y = groundY - 40 + Math.random() * 20);
        fireZones.forEach(fz => fz.y = groundY);
        draw();
    }
}
window.addEventListener('resize', resize);

function generateBackground() {
    for (let y = 0; y < L_HEIGHT; y += 2) {
        const t = y / L_HEIGHT;
        const r1 = parseInt(pal.skyTop.slice(1,3), 16), g1 = parseInt(pal.skyTop.slice(3,5), 16), b1 = parseInt(pal.skyTop.slice(5,7), 16);
        const r2 = parseInt(pal.skyBot.slice(1,3), 16), g2 = parseInt(pal.skyBot.slice(3,5), 16), b2 = parseInt(pal.skyBot.slice(5,7), 16);
        const r = Math.floor(r1 + (r2 - r1) * t);
        const g = Math.floor(g1 + (g2 - g1) * t);
        const b = Math.floor(b1 + (b2 - b1) * t);
        bgCtx.fillStyle = `rgb(${r},${g},${b})`;
        bgCtx.fillRect(0, y, L_WIDTH, 2);
    }
    if (currentToD === 'NIGHT' || currentToD === 'DAWN') {
        bgCtx.fillStyle = '#ffffff';
        for (let i = 0; i < 200; i++) {
            bgCtx.globalAlpha = Math.random() * 0.8 + 0.1;
            bgCtx.fillRect(Math.random() * L_WIDTH, Math.random() * (L_HEIGHT * 0.55), Math.random() > 0.8 ? 2 : 1, 1);
        }
        bgCtx.globalAlpha = 1;
    }
    bgCtx.fillStyle = '#0a0a14';
    bgCtx.beginPath();
    
    let mountBase = groundY - 30; 
    bgCtx.moveTo(0, mountBase);
    let mountainSegment = L_WIDTH / 10;
    for(let i=0; i<=L_WIDTH + mountainSegment; i+=mountainSegment) {
        bgCtx.lineTo(i, mountBase - 50 - Math.random() * 80);
    }
    bgCtx.lineTo(L_WIDTH, L_HEIGHT);
    bgCtx.lineTo(0, L_HEIGHT);
    bgCtx.fill();
}

function countPixels(context, x, y, w, h) {
    if (w <= 0 || h <= 0) return 0;
    const data = context.getImageData(x, y, w, h).data;
    let count = 0;
    for (let i = 3; i < data.length; i += 4) {
        if (data[i] > 0) count++;
    }
    return count;
}

function generateDestructibleCity() {
    cityCtx.clearRect(0, 0, L_WIDTH, L_HEIGHT);
    blinkingLights = [];
    
    cityCtx.fillStyle = '#111';
    cityCtx.fillRect(0, groundY, L_WIDTH, L_HEIGHT - groundY);
    cityCtx.fillStyle = '#222';
    cityCtx.fillRect(0, groundY, L_WIDTH, 6);

    const gap = 15;
    const bCount = Math.floor(L_WIDTH / 55);
    const futuristicColors = ['#1a1a24', '#2d3047', '#414a4c', '#536872', '#708090', '#3b4d61'];
    
    if (bCount > 0) {
        const bWidth = (L_WIDTH / bCount) - gap;
        for (let i = 0; i < bCount; i++) {
            const x = i * (bWidth + gap) + gap / 2;
            const w = bWidth + (Math.random() * 4 - 2);
            const h = 40 + Math.random() * 80;
            const y = groundY - h;

            const bColor = futuristicColors[Math.floor(Math.random() * futuristicColors.length)];
            cityCtx.fillStyle = bColor;
            
            const shapeType = Math.random();
            if (shapeType > 0.6) {
                cityCtx.fillRect(x, y, w, h);
                cityCtx.fillRect(x + w*0.15, y - 20, w*0.7, 20);
                cityCtx.fillRect(x + w*0.35, y - 40, w*0.3, 20);
            } else if (shapeType > 0.3) {
                cityCtx.fillRect(x, y + 20, w, h - 20);
                cityCtx.beginPath();
                cityCtx.moveTo(x, y + 20);
                cityCtx.lineTo(x + w/2, y - 10);
                cityCtx.lineTo(x + w, y + 20);
                cityCtx.fill();
            } else {
                cityCtx.fillRect(x, y, w, h);
            }
            
            cityCtx.fillStyle = Math.random() > 0.5 ? '#a8dadc' : '#457b9d';
            for (let wy = y + 10; wy < groundY - 10; wy += (Math.random() > 0.5 ? 12 : 8)) {
                if (Math.random() > 0.2) {
                    cityCtx.fillRect(x + w*0.1, wy, w*0.8, 3);
                }
            }

            if (Math.random() > 0.4) {
                const towerX = x + w / 2;
                const towerH = 15 + Math.random() * 10;
                cityCtx.fillStyle = '#555';
                cityCtx.fillRect(towerX - 1, y - towerH, 2, towerH);
                blinkingLights.push({x: towerX - 2, y: y - towerH - 2, offset: Math.random()*10, color: '#ff0000'});
            }

            cityCtx.fillStyle = '#2d6a4f';
            cityCtx.fillRect(x - 5, groundY - 8, 12, 8);
            cityCtx.fillStyle = '#40916c';
            cityCtx.fillRect(x - 3, groundY - 12, 8, 8);
        }
    }
    
    initialCityPixels = countPixels(cityCtx, 0, 0, L_WIDTH, L_HEIGHT);
    currentCityPixels = initialCityPixels;
}

function updateDamageDisplay() {
    document.getElementById('damageVal').innerText = Math.min(100, Math.floor(cityDamage));
}

class Cannon {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.angle = -Math.PI / 2;
        this.alive = true;
        this.isHidden = false;
        this.baseWidth = 40;
    }
    update(dt) {
        if (!this.alive || this.isHidden) return;
        let targetAngle = Math.atan2(pointer.y - this.y, pointer.x - this.x);
        if (targetAngle > 0) targetAngle = targetAngle > Math.PI/2 ? Math.PI : 0;
        let diff = targetAngle - this.angle;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        this.angle += diff * 15 * dt;
    }
    fire() {
        if (!this.alive || this.isHidden || ammo < 5) return;
        ammo -= 5;
        const bx = this.x + Math.cos(this.angle) * 30;
        const by = this.y + Math.sin(this.angle) * 30;
        
        if (currentWeapon === 'laser') {
            activeLasers.push({x: bx, y: by, angle: this.angle, life: 0.2});
            Audio.playShoot('laser');
            return;
        }
        if (currentWeapon === 'shotgun') {
            projectiles.push(new Projectile(bx, by, this.angle, 'default'));
            projectiles.push(new Projectile(bx, by, this.angle - 0.15, 'default'));
            projectiles.push(new Projectile(bx, by, this.angle + 0.15, 'default'));
            shells.push(new Shell(bx, by, this.x < L_WIDTH/2 ? -1 : 1));
            Audio.playShoot('shotgun');
        } else if (currentWeapon === 'flak') {
            projectiles.push(new Projectile(bx, by, this.angle, 'flak', null));
            shells.push(new Shell(bx, by, this.x < L_WIDTH/2 ? -1 : 1));
            Audio.playShoot('flak');
        } else if (currentWeapon === 'homing') {
            let target = findClosestTarget(bx, by);
            projectiles.push(new Projectile(bx, by, this.angle, 'homing', null, target, true));
            Audio.playShoot('homing');
        } else {
            projectiles.push(new Projectile(bx, by, this.angle, 'default'));
            shells.push(new Shell(bx, by, this.x < L_WIDTH/2 ? -1 : 1));
            Audio.playShoot('default');
        }
        for(let i=0; i<4; i++) {
            particles.push(new Particle(bx, by, '#00ffff', Math.cos(this.angle)*(100+Math.random()*100), Math.sin(this.angle)*(100+Math.random()*100), 0.15));
        }
    }
    draw(ctx) {
        if (this.isHidden) return;
        if (!this.alive) {
            ctx.fillStyle = '#111'; ctx.fillRect(this.x - this.baseWidth/2, this.y, this.baseWidth, 10);
            return;
        }
        ctx.save();
        ctx.translate(this.x, this.y);
        
        ctx.save();
        ctx.rotate(this.angle);
        ctx.fillStyle = '#ff9900'; 
        ctx.fillRect(0, -8, 30, 16);
        ctx.fillStyle = '#ffffff'; 
        ctx.fillRect(24, -6, 6, 12); 
        ctx.restore();
        
        ctx.fillStyle = '#ff5500'; 
        ctx.fillRect(-this.baseWidth/2, -10, this.baseWidth, 20);
        ctx.fillStyle = '#ffff00'; 
        ctx.fillRect(-this.baseWidth/2 + 4, -4, this.baseWidth - 8, 4);
        
        ctx.restore();
    }
}

class Shell {
    constructor(x, y, dir) {
        this.x = x; this.y = y;
        this.vx = dir * (50 + Math.random()*100);
        this.vy = -150 - Math.random()*100;
        this.rot = Math.random() * Math.PI;
        this.life = 2.0;
    }
    update(dt) {
        this.vy += 600 * dt; 
        this.x += this.vx * dt; this.y += this.vy * dt;
        this.rot += dt * 10;
        if (this.y > groundY + 10) {
            this.y = groundY + 10;
            this.vy *= -0.5;
            this.vx *= 0.5;
        }
        this.life -= dt;
    }
    draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot);
        ctx.fillStyle = '#ffcc00'; ctx.fillRect(-3, -1, 6, 3);
        ctx.restore();
    }
}

function findClosestTarget(x, y) {
    let best = null; let minDist = Infinity;
    enemies.forEach(e => {
        if(e.active) { let d = Math.hypot(e.x+e.w/2 - x, e.y+e.h/2 - y); if(d < minDist) { minDist=d; best=e; } }
    });
    bombs.forEach(b => {
        if(b.active) { let d = Math.hypot(b.x - x, b.y - y); if(d < minDist) { minDist=d; best=b; } }
    });
    return best;
}

function blastEnemies(x, y, radius) {
    enemies.forEach(e => {
        if (e.active && Math.hypot(e.x+e.w/2 - x, e.y+e.h/2 - y) < radius) {
            e.active = false; score += e.pts; createExplosion(e.x, e.y, true);
            if (e.type === 5) bgFlashTimer = 1.0;
            if (Math.random() < 0.15) powerups.push(new PowerUp(e.x, e.y));
        }
    });
    bombs.forEach(b => {
        if (b.active && Math.hypot(b.x - x, b.y - y) < radius) {
            b.active = false; score += 50; createExplosion(b.x, b.y, false);
        }
    });
    powerups.forEach(pu => {
        if (pu.active && Math.hypot(pu.x - x, pu.y - y) < radius) {
            pu.active = false; applyPowerup(pu.type); createExplosion(pu.x, pu.y, false); Audio.playPowerup();
        }
    });
}

function checkLineIntersection(x1, y1, x2, y2, rect) {
    if (Math.min(x1,x2) > rect.x+rect.w || Math.max(x1,x2) < rect.x) return false;
    if (Math.min(y1,y2) > rect.y+rect.h || Math.max(y1,y2) < rect.y) return false;

    const lineIntersect = (x1, y1, x2, y2, x3, y3, x4, y4) => {
        const denom = (y4-y3)*(x2-x1) - (x4-x3)*(y2-y1);
        if (denom === 0) return false;
        const uA = ((x4-x3)*(y1-y3) - (y4-y3)*(x1-x3)) / denom;
        const uB = ((x2-x1)*(y1-y3) - (y2-y1)*(x1-x3)) / denom;
        return (uA >= 0 && uA <= 1 && uB >= 0 && uB <= 1);
    };

    const rx = rect.x, ry = rect.y, rw = rect.w, rh = rect.h;
    if (x1 >= rx && x1 <= rx+rw && y1 >= ry && y1 <= ry+rh) return true;
    if (x2 >= rx && x2 <= rx+rw && y2 >= ry && y2 <= ry+rh) return true;

    return lineIntersect(x1,y1, x2,y2, rx,ry, rx+rw,ry) ||
           lineIntersect(x1,y1, x2,y2, rx+rw,ry, rx+rw,ry+rh) ||
           lineIntersect(x1,y1, x2,y2, rx,ry+rh, rx+rw,ry+rh) ||
           lineIntersect(x1,y1, x2,y2, rx,ry, rx,ry+rh);
}

class Projectile {
    constructor(x, y, angle, projType, targetY = null, target = null, isHoming = false) {
        this.x = x; this.y = y; this.angle = angle;
        this.projType = projType;
        const speed = 450; 
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.active = true;
        this.isFlak = (projType === 'flak');
        this.targetY = targetY;
        this.target = target;
        this.isHoming = isHoming;
    }
    update(dt) {
        if (this.isHoming) {
            if (this.target && this.target.active) {
                const targetAngle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
                let diff = targetAngle - this.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                this.angle += diff * 15 * dt; 
                this.vx = Math.cos(this.angle) * 450;
                this.vy = Math.sin(this.angle) * 450;
                
                if (Math.hypot(this.target.x - this.x, this.target.y - this.y) < 30) {
                    this.active = false;
                    blastEnemies(this.x, this.y, 40);
                    createExplosion(this.x, this.y, false);
                    Audio.playExplosion(false);
                }
            } else if (this.target && !this.target.active) {
                this.target = findClosestTarget(this.x, this.y);
            }
        }
        
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        
        if (this.isFlak) {
            let proxDetonate = false;
            const proxRadius = 70;
            
            if (this.targetY !== null && this.y <= this.targetY) proxDetonate = true;
            
            if (!proxDetonate) {
                for (let e of enemies) {
                    if (e.active && Math.hypot((e.x + e.w/2) - this.x, (e.y + e.h/2) - this.y) < proxRadius) {
                        proxDetonate = true; break;
                    }
                }
                if (!proxDetonate) {
                    for (let b of bombs) {
                        if (b.active && Math.hypot(b.x - this.x, b.y - this.y) < proxRadius) {
                            proxDetonate = true; break;
                        }
                    }
                }
                if (!proxDetonate) {
                    for (let pu of powerups) {
                        if (pu.active && Math.hypot(pu.x - this.x, pu.y - this.y) < proxRadius) {
                            proxDetonate = true; break;
                        }
                    }
                }
            }

            if (proxDetonate) {
                this.active = false;
                createExplosion(this.x, this.y, true);
                blastEnemies(this.x, this.y, 120);
            }
        }
        
        if (this.y < -50 || this.x < -50 || this.x > L_WIDTH + 50 || this.y > L_HEIGHT+50) this.active = false;
        
        if (this.projType === 'homing' || this.projType === 'flak') {
            if (Math.random() > 0.5) particles.push(new Particle(this.x, this.y, this.target ? '#ffaa00' : '#00ffff', -this.vx*0.1, -this.vy*0.1, 0.1));
        }
    }
    draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
        if (this.projType === 'default') {
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(-6, -1, 12, 2);
        } else {
            ctx.fillStyle = this.isHoming ? '#ffaa00' : (this.isFlak ? '#ff3333' : '#00ffff');
            ctx.fillRect(-8, -2, 16, 4);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(-4, -1, 8, 2);
        }
        ctx.restore();
    }
}

class FireZone {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.life = 0.4; 
    }
    update(dt) {
        this.life -= dt;
        if (Math.random() < 0.6) {
            particles.push(new Particle(this.x + (Math.random()-0.5)*40, this.y - Math.random()*15, '#ff5500', (Math.random()-0.5)*20, -10 - Math.random()*40, 0.15 + Math.random()*0.2));
        }
        if (Math.random() < 0.8) {
            particles.push(new Particle(this.x + (Math.random()-0.5)*50, this.y - 10 - Math.random()*20, '#444444', (Math.random()-0.5)*30, -30 - Math.random()*50, 0.2 + Math.random()*0.3));
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `rgba(255, 85, 0, ${Math.max(0, this.life * 2)})`;
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, 40, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function carveColumn(x, y, width) {
    const sx = Math.max(0, Math.floor(x - width/2));
    const sy = Math.max(0, Math.floor(y));
    const ex = Math.min(L_WIDTH, Math.ceil(x + width/2));
    const ey = Math.floor(groundY);
    const w = ex - sx; const h = ey - sy;
    if (w <= 0 || h <= 0) return 0;

    const before = countPixels(cityCtx, sx, sy, w, h);
    cityCtx.globalCompositeOperation = 'destination-out';
    cityCtx.fillRect(sx, sy, w, h);
    cityCtx.beginPath(); cityCtx.arc(x, sy, width/2, 0, Math.PI * 2); cityCtx.fill();
    cityCtx.globalCompositeOperation = 'source-over';
    
    blinkingLights = blinkingLights.filter(l => l.x < sx || l.x > ex || l.y < sy - width/2);
    
    const after = countPixels(cityCtx, sx, sy, w, h);
    const destroyed = Math.max(0, before - after);
    currentCityPixels -= destroyed;
    return destroyed;
}

class Enemy {
    constructor(type) {
        this.type = type; this.active = true;
        this.dir = Math.random() > 0.5 ? 1 : -1;
        const sprMap = {1: SPRITES.scout, 2: SPRITES.raider, 3: SPRITES.bomber, 4: SPRITES.deathray, 5: SPRITES.interceptor};
        this.img = sprMap[type];
        this.w = this.img.width; this.h = this.img.height;
        this.x = this.dir === 1 ? -this.w : L_WIDTH;
        this.isBeaming = false;
        this.lazerAudioTimer = 0;
        this.beamTargetX = 0;
        this.currentHitY = groundY;
        
        switch(type) {
            case 1: this.baseLevel = 0; this.speed = 75; this.pts = 100; this.bombChance = 0.05; break; 
            case 2: this.baseLevel = 1; this.speed = 50; this.pts = 200; this.bombChance = 0.1; break;
            case 3: this.baseLevel = 2; this.speed = 35; this.pts = 500; this.bombChance = 0.2; break;
            case 4: this.baseLevel = 3; this.speed = 25; this.pts = 1500; this.bombChance = 0.4; break;
            case 5: this.baseLevel = 0; this.speed = 180; this.pts = 300; this.bombChance = 0.02; Audio.playAlarm(); break; 
        }
        
        this.speed *= difficultyMult;
        
        this.maxLevel = 4;
        this.level = this.baseLevel;
        let beamThreshold = groundY - 160;
        this.y = 30 + (this.level / this.maxLevel) * (beamThreshold - 30);
    }
    update(dt) {
        const beamThreshold = groundY - 160;
        this.x += this.speed * this.dir * dt;
        
        if ((this.dir === 1 && this.x > L_WIDTH + 60) || (this.dir === -1 && this.x < -this.w - 60)) {
            if (this.level >= this.maxLevel) {
                this.active = false; 
            } else {
                this.dir *= -1; 
                this.level++;
                this.y = 30 + (this.level / this.maxLevel) * (beamThreshold - 30);
                this.x = Math.max(-this.w - 20, Math.min(L_WIDTH + 20, this.x)); 
                this.speed *= 1.2; 
                Audio.playShipSpawn(this.type);
            }
        }

        let isFullyOnScreen = (this.x > 10 && this.x + this.w < L_WIDTH - 10);
        
        if (this.y >= beamThreshold - 1 && isFullyOnScreen) {
            if (!this.isBeaming) {
                this.isBeaming = true;
                this.lazerAudioTimer = 0;
            }
        } else {
            this.isBeaming = false;
        }

        if (this.isBeaming) {
            this.beamTargetX = this.x + this.w / 2;
            
            if (cityShieldTimer > 0) {
                this.currentHitY = groundY - 100;
                if (Math.random() < dt * 10) createExplosion(this.beamTargetX, groundY - 100, false);
            } else {
                // Guarantee mathematical 20% Damage over the sweep
                let sweepDuration = L_WIDTH / this.speed;
                let damagePerSec = 20.0 / sweepDuration;
                cityDamage += damagePerSec * dt;
                updateDamageDisplay();

                let hitY = groundY;
                const scanW = 10;
                const safeX = Math.max(0, Math.min(L_WIDTH - scanW, Math.floor(this.beamTargetX - scanW/2)));
                const scanStartY = Math.max(0, Math.floor(this.y));
                const scanHeight = Math.max(1, Math.floor(groundY - scanStartY));
                
                const pxData = cityCtx.getImageData(safeX, scanStartY, scanW, scanHeight).data;
                for (let i = 3; i < pxData.length; i += 4) {
                    if (pxData[i] > 0) {
                        const pixelIndex = i / 4;
                        const localY = Math.floor(pixelIndex / scanW);
                        hitY = scanStartY + localY;
                        break;
                    }
                }
                this.currentHitY = hitY;

                // Execute visual-only carve at point of contact
                carveColumn(this.beamTargetX, hitY, 20);

                if (Math.random() < dt * 15) {
                    particles.push(new Particle(this.beamTargetX + (Math.random()-0.5)*20, hitY, Math.random()>0.5?'#ff00ff':'#00ffff', (Math.random()-0.5)*100, -Math.random()*150, 0.2));
                }
                
                checkEntitiesInBlast(this.beamTargetX, hitY, 30, false);
            }
            
            this.lazerAudioTimer -= dt;
            if (this.lazerAudioTimer <= 0) {
                Audio.playLazerBuzz();
                this.lazerAudioTimer = 0.05;
            }
            
            if (Math.random() < dt * 5) {
                 fireZones.push(new FireZone(this.beamTargetX, this.currentHitY));
            }
        }
        
        if (!this.isBeaming && Math.random() < this.bombChance * dt * difficultyMult) {
            if (this.x > 50 && this.x < L_WIDTH - 50) bombs.push(new Bomb(this.x + this.w/2, this.y + this.h));
        }
    }
    draw(ctx) {
        if (this.isBeaming) {
            const bx = this.x + this.w/2;
            const by = this.y + this.h;
            
            ctx.globalCompositeOperation = 'lighter';
            
            ctx.fillStyle = (Math.random() > 0.5) ? '#ff00ff' : '#00ffff';
            ctx.fillRect(bx - 6, by, 12, this.currentHitY - by);
            
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(bx - 2, by, 4, this.currentHitY - by);
            
            ctx.globalCompositeOperation = 'source-over';
        }
        ctx.save(); ctx.translate(Math.floor(this.x), Math.floor(this.y));
        if (this.dir === -1) { ctx.translate(this.w, 0); ctx.scale(-1, 1); }
        ctx.drawImage(this.img, 0, 0);
        ctx.restore();
    }
}

class Bomb {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.vy = 75 * Math.sqrt(difficultyMult); 
        this.active = true;
    }
    update(dt) {
        this.y += this.vy * dt;
        particles.push(new Particle(this.x, this.y, '#ff3333', (Math.random()-0.5)*10, -this.vy*0.2, 0.2));
        
        if (cityShieldTimer > 0 && this.y > groundY - 100) {
            const dx = (this.x - L_WIDTH/2) / (L_WIDTH/2 - 20);
            const dy = (this.y - groundY) / 150;
            if (dx*dx + dy*dy <= 1) {
                this.active = false; createExplosion(this.x, this.y, false); return;
            }
        }

        if (this.y > 100) {
            const safeX = Math.max(0, Math.min(L_WIDTH-1, Math.floor(this.x)));
            const safeY = Math.max(0, Math.min(L_HEIGHT-1, Math.floor(this.y)));
            const pixel = cityCtx.getImageData(safeX, safeY, 1, 1).data;
            
            if (pixel[3] > 0 || this.y > groundY) { 
                this.active = false;
                createExplosion(this.x, this.y, true);
                carveCity(this.x, this.y, 25);
                checkEntitiesInBlast(this.x, this.y, 35, true);
                cityDamage += 5.0; // Math-based 5% damage per bomb
                updateDamageDisplay();
            }
        }
    }
    draw(ctx) {
        ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.floor(this.x - 2), Math.floor(this.y - 6), 4, 12);
        ctx.fillStyle = '#ff3333'; ctx.fillRect(Math.floor(this.x - 4), Math.floor(this.y - 2), 8, 4);
    }
}

class PowerUp {
    constructor(x, y) {
        this.x = Math.max(30, Math.min(L_WIDTH - 30, x));
        this.y = y;
        this.active = true;
        this.vy = 40; 
        
        const r = Math.random();
        if (r < 0.05) { this.type = 'shield'; this.color = '#00aaff'; } 
        else if (r < 0.15) { this.type = 'birds'; this.color = '#ffffff'; } 
        else {
            const types = ['shotgun', 'flak', 'homing', 'laser'];
            this.type = types[Math.floor(Math.random()*types.length)];
            this.color = '#55ff55';
        }
        this.letter = this.type === 'birds' ? '🐦' : this.type.charAt(0).toUpperCase();
    }
    update(dt) {
        this.y += this.vy * dt;
        
        // Safety clamp on borders while falling
        this.x = Math.max(30, Math.min(L_WIDTH - 30, this.x));

        if (this.y > groundY || !this.active) {
            this.active = false;
            applyPowerup(this.type);
            createExplosion(this.x, this.y, false);
            Audio.playPowerup();
        }
    }
    draw(ctx) {
        ctx.fillStyle = this.color; ctx.fillRect(this.x - 10, this.y - 10, 20, 20);
        ctx.fillStyle = '#000'; ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(this.letter, this.x, this.y);
    }
}

class Bird {
    constructor(x, y, target) {
        this.x = x; this.y = y; this.target = target;
        this.active = true;
        this.speed = 500;
        this.angle = -Math.PI/2;
        this.state = 'HOVER';
        this.hoverTimer = 2.0;
        this.hoverY = 80 + Math.random() * 60;
        this.hoverX = L_WIDTH/2 + (Math.random() - 0.5) * 400;
    }
    update(dt) {
        if (this.state === 'HOVER') {
            this.hoverTimer -= dt;
            this.x += (this.hoverX - this.x) * 4 * dt;
            this.y += (this.hoverY - this.y) * 4 * dt;
            this.angle = Math.sin(globalTime * 10 + this.hoverX) * 0.2;
            if (Math.random() < 0.02) Audio.playChirp();
            
            if (this.hoverTimer <= 0) {
                this.state = 'ATTACK';
                this.angle = -Math.PI/2;
            }
            return;
        }

        if (this.target && !this.target.active) {
            this.target = findClosestTarget(this.x, this.y);
        }
        if (this.target) {
            const targetAngle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
            let diff = targetAngle - this.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            this.angle += diff * 10 * dt;
        }
        this.x += Math.cos(this.angle) * this.speed * dt;
        this.y += Math.sin(this.angle) * this.speed * dt;
        
        if (this.y < -50 || this.x < -50 || this.x > L_WIDTH + 50 || this.y > L_HEIGHT+50) this.active = false;
        
        if (this.target && Math.hypot(this.target.x - this.x, this.target.y - this.y) < 20) {
            this.active = false; this.target.active = false;
            score += this.target.pts ? this.target.pts : 50;
            if (this.target.type === 5) bgFlashTimer = 1.0;
            document.getElementById('scoreVal').innerText = score;
            createFeatherPuff(this.x, this.y);
            Audio.playExplosion(false);
        }
    }
    draw(ctx) {
        ctx.save(); 
        ctx.translate(this.x, this.y); 
        
        if (this.state === 'HOVER') {
            ctx.rotate(this.angle);
        } else {
            ctx.rotate(this.angle - Math.PI);
            if (Math.cos(this.angle) > 0) {
                ctx.scale(1, -1);
            }
        }

        ctx.font = '24px Arial';
        ctx.textAlign = 'center'; 
        ctx.textBaseline = 'middle';
        ctx.fillText('🐦', 0, 0);
        ctx.restore();
    }
}

class FeatherParticle {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * 100;
        this.vy = (Math.random() - 0.5) * 100 - 50;
        this.life = 1.0 + Math.random() * 1.0; 
        this.maxLife = this.life;
        this.rot = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 10;
    }
    update(dt) {
        this.x += this.vx * dt; this.y += this.vy * dt;
        this.vy += 100 * dt; 
        this.vx *= 0.95; 
        this.rot += this.rotSpeed * dt;
        this.life -= dt;
    }
    draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot);
        ctx.font = '16px Arial';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.fillText('🪶', 0, 0);
        ctx.restore();
    }
}

function createFeatherPuff(x, y) {
    for(let i=0; i<8; i++) {
        feathers.push(new FeatherParticle(x, y));
    }
    createExplosion(x, y, false);
}

class Particle {
    constructor(x, y, color, vx, vy, life) {
        this.x = x; this.y = y; this.color = color;
        this.vx = vx; this.vy = vy; this.life = life; this.maxLife = life;
        this.size = Math.random() * 4 + 2;
    }
    update(dt) {
        this.x += this.vx * dt; this.y += this.vy * dt;
        this.vx *= 0.9; this.vy *= 0.9; this.life -= dt;
    }
    draw(ctx) {
        ctx.fillStyle = this.color;
        const s = Math.max(1, this.size * (this.life / this.maxLife));
        ctx.fillRect(Math.floor(this.x - s/2), Math.floor(this.y - s/2), Math.floor(s), Math.floor(s));
    }
}

class Pedestrian {
    constructor() {
        this.x = Math.random() > 0.5 ? -10 : L_WIDTH + 10;
        this.y = groundY - 5;
        this.vx = (this.x < 0 ? 1 : -1) * (15 + Math.random() * 10); 
        this.active = true;
        this.color = Math.random() > 0.5 ? '#ffffff' : '#00ffff';
    }
    update(dt) {
        this.x += this.vx * dt;
        if (this.x < -20 || this.x > L_WIDTH + 20) this.active = false;
    }
    draw(ctx) {
        ctx.fillStyle = this.color; ctx.fillRect(Math.floor(this.x), Math.floor(this.y), 2, 4);
    }
}

class Vehicle {
    constructor() {
        this.x = Math.random() > 0.5 ? -20 : L_WIDTH + 20;
        this.y = groundY - 40 + Math.random() * 20;
        this.vx = (this.x < 0 ? 1 : -1) * (50 + Math.random() * 30); 
        this.active = true;
        this.color = Math.random() > 0.5 ? '#ff0055' : '#00aaff';
    }
    update(dt) {
        this.x += this.vx * dt;
        if (this.x < -40 || this.x > L_WIDTH + 40) this.active = false;
    }
    draw(ctx) {
        ctx.fillStyle = this.color; ctx.fillRect(Math.floor(this.x), Math.floor(this.y), 10, 4);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.floor(this.x + (this.vx > 0 ? 6 : 2)), Math.floor(this.y + 1), 2, 2);
    }
}

function applyPowerup(type) {
    if (type === 'birds') {
        enemies.forEach(e => birds.push(new Bird(L_WIDTH/2, groundY, e)));
        bombs.forEach(b => birds.push(new Bird(L_WIDTH/2, groundY, b)));
        powerups = [];
        document.getElementById('powerupVal').innerText = "AVIAN STRIKE ACTIVE";
        document.getElementById('powerupVal').style.color = '#ffffff';
    } else if (type === 'shield') {
        cityShieldTimer = 15.0; 
        document.getElementById('powerupVal').innerText = "SHIELD ACTIVE";
        document.getElementById('powerupVal').style.color = '#00aaff';
    } else {
        currentWeapon = type;
        weaponTimer = 10.0;
        document.getElementById('powerupVal').innerText = type + " ACTIVE";
        document.getElementById('powerupVal').style.color = '#ffaa00';
    }
}

function createExplosion(x, y, isLarge) {
    const count = isLarge ? 80 : 25;
    const speed = isLarge ? 300 : 150;
    Audio.playExplosion(isLarge);
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const s = Math.random() * speed;
        particles.push(new Particle(x, y, Math.random()>0.5?'#ffffff':'#ffaa00', Math.cos(angle)*s, Math.sin(angle)*s, Math.random()*0.5 + 0.3));
    }
}

function carveCity(x, y, radius) {
    const sx = Math.max(0, Math.floor(x - radius));
    const sy = Math.max(0, Math.floor(y - radius));
    const ex = Math.min(L_WIDTH, Math.ceil(x + radius));
    const ey = Math.min(L_HEIGHT, Math.ceil(y + radius));
    const w = ex - sx; const h = ey - sy;
    if (w <= 0 || h <= 0) return 0;

    const before = countPixels(cityCtx, sx, sy, w, h);
    cityCtx.globalCompositeOperation = 'destination-out';
    cityCtx.beginPath(); cityCtx.arc(x, y, radius, 0, Math.PI * 2); cityCtx.fill();
    cityCtx.globalCompositeOperation = 'source-over';
    
    blinkingLights = blinkingLights.filter(l => Math.hypot((l.x + 2) - x, (l.y + 3) - y) >= radius);
    
    const after = countPixels(cityCtx, sx, sy, w, h);
    const destroyed = Math.max(0, before - after);
    currentCityPixels -= destroyed;
    return destroyed;
}

function checkEntitiesInBlast(x, y, radius, damageCannons = true) {
    if (damageCannons) {
        cannons.forEach(c => {
            if (c.alive && Math.hypot(c.x - x, c.y - y) < radius) { c.alive = false; createExplosion(c.x, c.y, true); }
        });
    }
    pedestrians.forEach(p => { if (p.active && Math.hypot(p.x - x, p.y - y) < radius) p.active = false; });
    vehicles.forEach(v => { if (v.active && Math.hypot(v.x - x, v.y - y) < radius) { v.active = false; createExplosion(v.x, v.y, false); } });
}

function initGame() {
    const tods = ['DAWN', 'DAY', 'SUNSET', 'NIGHT'];
    currentToD = tods[Math.floor(Math.random() * tods.length)];
    pal = PALETTES[currentToD];
    document.getElementById('timeVal').innerText = currentToD;
    
    score = 0; document.getElementById('scoreVal').innerText = '0';
    currentWave = 1; document.getElementById('levelVal').innerText = 'WAVE ' + currentWave;
    
    initialCityPixels = 0; 
    currentCityPixels = 0;
    cityDamage = 0.0;
    updateDamageDisplay();

    ammo = MAX_AMMO; difficultyMult = 1; spawnTimer = 1.0; shakeAmount = 0; bgFlashTimer = 0;
    waveTimer = 45; 
    isWaveTransition = false;
    gameOverAnimTimer = 0;
    currentWeapon = 'default'; document.getElementById('powerupVal').innerText = '';
    cityShieldTimer = 0;
    
    cannons = [new Cannon(0, 0), new Cannon(0, 0), new Cannon(0, 0)];
    resize();
    
    projectiles = []; enemies = []; bombs = []; particles = []; feathers = []; birds = [];
    pedestrians = []; vehicles = []; shells = []; powerups = []; activeLasers = []; fireZones = [];
}

function startWaveTransition() {
    isWaveTransition = true;
    document.getElementById('levelTransition').style.display = 'block';
    
    setTimeout(() => {
        currentWave++;
        difficultyMult += 0.2;
        waveTimer = 45 + (currentWave * 5); 
        document.getElementById('levelVal').innerText = 'WAVE ' + currentWave;
        
        // Fully reset damage for the new wave
        cityDamage = 0.0;
        updateDamageDisplay();
        generateDestructibleCity(); 
        
        cannons.forEach(c => c.alive = true); 
        ammo = MAX_AMMO;
        
        const tods = ['DAWN', 'DAY', 'SUNSET', 'NIGHT'];
        currentToD = tods[Math.floor(Math.random() * tods.length)];
        pal = PALETTES[currentToD];
        document.getElementById('timeVal').innerText = currentToD;
        generateBackground();
        
        document.getElementById('levelTransition').style.display = 'none';
        isWaveTransition = false;
    }, 4000);
}

let isFiring = false; let firingTimer = 0;

function handleInput(x, y, isDown) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = L_WIDTH / rect.width;
    const scaleY = L_HEIGHT / rect.height;
    pointer.x = (x - rect.left) * scaleX;
    pointer.y = (y - rect.top) * scaleY;
    
    if (gameState === 'PLAYING' && !isWaveTransition) {
        isFiring = isDown;
        if (isDown && firingTimer <= 0) {
            fireClosestCannon();
            firingTimer = 0.1; 
        }
    }
}

function fireClosestCannon() {
    let best = null; let minDist = Infinity;
    cannons.forEach(c => {
        if(c.alive && !c.isHidden) { 
            const dist = Math.abs(c.x - pointer.x); 
            if(dist < minDist){ minDist=dist; best=c; } 
        }
    });
    if(best) best.fire();
}

window.addEventListener('mousemove', e => handleInput(e.clientX, e.clientY, isFiring));
window.addEventListener('mousedown', e => handleInput(e.clientX, e.clientY, true));
window.addEventListener('mouseup', e => handleInput(e.clientX, e.clientY, false));
window.addEventListener('touchmove', e => { if(e.cancelable) e.preventDefault(); handleInput(e.touches[0].clientX, e.touches[0].clientY, true); }, {passive: false});
window.addEventListener('touchstart', e => { if(e.cancelable) e.preventDefault(); handleInput(e.touches[0].clientX, e.touches[0].clientY, true); }, {passive: false});
window.addEventListener('touchend', e => { isFiring = false; });

function triggerGameOverAnimation() {
    gameState = 'GAMEOVER_ANIM';
    gameOverAnimTimer = 4.0; 
    shakeAmount = 40; 
    Audio.playExplosion(true);
    for(let i=0; i<100; i++) {
        const x = Math.random() * L_WIDTH;
        const y = groundY - Math.random() * 100;
        const angle = Math.random() * Math.PI * 2;
        const s = Math.random() * 300;
        particles.push(new Particle(x, y, Math.random()>0.5?'#ff3333':'#ffaa00', Math.cos(angle)*s, Math.sin(angle)*s, Math.random()*1.0 + 0.5));
    }
}

function updateGameOverAnim(dt) {
    gameOverAnimTimer -= dt;
    for(let i=0; i<5; i++) {
        const x = Math.random() * L_WIDTH;
        const y = groundY - Math.random() * 50;
        particles.push(new Particle(x, y, '#ffaa00', (Math.random()-0.5)*50, -Math.random()*150, 0.5 + Math.random()));
        particles.push(new Particle(x, y, '#ff3333', (Math.random()-0.5)*50, -Math.random()*150, 0.5 + Math.random()));
        particles.push(new Particle(x, y, '#222222', (Math.random()-0.5)*30, -Math.random()*100, 1.0 + Math.random()));
    }
    if (Math.random() < 0.1) Audio.playExplosion(false);
    particles.forEach(p => p.life > 0 && p.update(dt));
    particles = particles.filter(p => p.life > 0);
    shakeAmount = 25 + Math.random() * 15;
    if (gameOverAnimTimer <= 0) {
        shakeAmount = 0;
        gameState = 'GAMEOVER';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('gameOverScreen').style.display = 'flex';
        document.getElementById('finalScoreDisplay').innerText = score;
    }
}

function update(dt) {
    globalTime += dt;
    
    if (bgFlashTimer > 0) bgFlashTimer -= dt * 2;
    
    if (weaponTimer > 0 && currentWeapon !== 'shield' && currentWeapon !== 'birds') {
        weaponTimer -= dt;
        if (weaponTimer <= 0) { currentWeapon = 'default'; document.getElementById('powerupVal').innerText = ''; }
    }
    if (cityShieldTimer > 0) {
        cityShieldTimer -= dt;
        if (cityShieldTimer <= 0) { document.getElementById('powerupVal').innerText = ''; }
    }
    if (!isWaveTransition) {
        waveTimer -= dt;
        if (waveTimer <= 0 && enemies.length === 0) startWaveTransition();
    }
    ammo = Math.min(MAX_AMMO, ammo + ammoRegenRate * dt);
    document.getElementById('ammoBar').style.width = `${(ammo/MAX_AMMO)*100}%`;
    
    if (isFiring && !isWaveTransition) {
        firingTimer -= dt;
        if (firingTimer <= 0) { fireClosestCannon(); firingTimer = 0.1; }
    }

    if (!isWaveTransition) {
        spawnTimer -= dt;
        if (spawnTimer <= 0 && waveTimer > 0) { 
            spawnTimer = (2.5 / difficultyMult) + Math.random(); 
            let type = 1; const r = Math.random();
            if (difficultyMult > 1.2 && r > 0.7) type = 5; 
            else if (difficultyMult > 1.4 && r > 0.6) type = 4;
            else if (difficultyMult > 1.2 && r > 0.5) type = 3;
            else if (difficultyMult > 1.1 && r > 0.3) type = 2;
            enemies.push(new Enemy(type));
        }
    }
    
    if (Math.random() < dt * 2) pedestrians.push(new Pedestrian());
    if (Math.random() < dt) vehicles.push(new Vehicle());

    cannons.forEach(c => c.update(dt));
    projectiles.forEach(p => p.active && p.update(dt));
    enemies.forEach(e => e.active && e.update(dt));
    bombs.forEach(b => b.active && b.update(dt));
    particles.forEach(p => p.life > 0 && p.update(dt));
    feathers.forEach(f => f.life > 0 && f.update(dt));
    shells.forEach(s => s.life > 0 && s.update(dt));
    powerups.forEach(p => p.active && p.update(dt));
    pedestrians.forEach(p => p.active && p.update(dt));
    vehicles.forEach(v => v.active && v.update(dt));
    birds.forEach(b => b.active && b.update(dt));
    fireZones.forEach(fz => fz.life > 0 && fz.update(dt));

    for (let i = activeLasers.length -1; i >= 0; i--) {
        let l = activeLasers[i]; l.life -= dt;
        if (l.life <= 0) { activeLasers.splice(i,1); continue; }
        
        const endX = l.x + Math.cos(l.angle) * 1500;
        const endY = l.y + Math.sin(l.angle) * 1500;
        
        enemies.forEach(e => {
            if(e.active && checkLineIntersection(l.x, l.y, endX, endY, {x:e.x, y:e.y, w:e.w, h:e.h})) {
                e.active = false; score += e.pts; createExplosion(e.x + e.w/2, e.y + e.h/2, false);
                if (e.type === 5) bgFlashTimer = 1.0;
                if (Math.random() < 0.25) powerups.push(new PowerUp(e.x, e.y));
            }
        });
        bombs.forEach(b => {
            if(b.active && checkLineIntersection(l.x, l.y, endX, endY, {x:b.x-5, y:b.y-5, w:10, h:10})) {
                b.active = false; score += 50; createExplosion(b.x, b.y, false);
            }
        });
        powerups.forEach(pu => {
            if(pu.active && checkLineIntersection(l.x, l.y, endX, endY, {x:pu.x-10, y:pu.y-10, w:20, h:20})) {
                pu.active = false; applyPowerup(pu.type); createExplosion(pu.x, pu.y, false); Audio.playPowerup();
            }
        });
    }

    for (let p of projectiles) {
        if (!p.active) continue;
        for (let e of enemies) {
            if (!e.active) continue;
            if (p.x > e.x && p.x < e.x + e.w && p.y > e.y && p.y < e.y + e.h) {
                p.active = false; e.active = false; score += e.pts; 
                createExplosion(e.x + e.w/2, e.y + e.h/2, true); ammo = Math.min(MAX_AMMO, ammo + 20);
                if (e.type === 5) bgFlashTimer = 1.0;
                if (Math.random() < 0.25) powerups.push(new PowerUp(e.x, e.y)); 
                break;
            }
        }
        for (let b of bombs) {
            if (!b.active || p.isFlak || p.isShrapnel) continue; 
            if (Math.hypot(p.x - b.x, p.y - b.y) < 20) {
                p.active = false; b.active = false; score += 50; createExplosion(b.x, b.y, false); break;
            }
        }
    }

    for (let pu of powerups) {
        if (!pu.active) continue;
        for (let p of projectiles) {
            if(p.active && Math.hypot(pu.x - p.x, pu.y - p.y) < 20) {
                p.active = false; pu.active = false; applyPowerup(pu.type); createExplosion(pu.x, pu.y, false); Audio.playPowerup();
            }
        }
    }

    // GAME OVER CONDITION
    if ((cityDamage >= 100 || !cannons.some(c => c.alive)) && gameState !== 'GAMEOVER_ANIM') {
        triggerGameOverAnimation();
    }

    projectiles = projectiles.filter(p => p.active);
    enemies = enemies.filter(e => e.active);
    bombs = bombs.filter(b => b.active);
    particles = particles.filter(p => p.life > 0);
    feathers = feathers.filter(f => f.life > 0);
    shells = shells.filter(s => s.life > 0);
    powerups = powerups.filter(p => p.active);
    pedestrians = pedestrians.filter(p => p.active);
    vehicles = vehicles.filter(v => v.active);
    birds = birds.filter(b => b.active);
    fireZones = fireZones.filter(fz => fz.life > 0);

    if (gameState !== 'GAMEOVER_ANIM' && shakeAmount > 0) {
        shakeAmount -= dt * 30;
        if (shakeAmount < 0) shakeAmount = 0;
    }
}

function draw() {
    ctx.save();
    if (shakeAmount > 0) ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);

    ctx.drawImage(bgCanvas, 0, 0);
    ctx.drawImage(cityCanvas, 0, 0);
    
    if (bgFlashTimer > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${bgFlashTimer})`;
        ctx.fillRect(0, 0, L_WIDTH, L_HEIGHT);
    }
    
    if (cityShieldTimer > 0) {
        ctx.save(); ctx.beginPath();
        ctx.ellipse(L_WIDTH/2, groundY, L_WIDTH/2 - 20, 150, 0, Math.PI, 0);
        ctx.fillStyle = `rgba(0, 255, 255, ${Math.min(0.2, cityShieldTimer/2)})`; ctx.fill();
        ctx.strokeStyle = `rgba(0, 255, 255, ${Math.min(0.8, cityShieldTimer/2)})`; ctx.lineWidth = 4; ctx.stroke();
        ctx.restore();
    }
    
    blinkingLights.forEach(l => {
        if (Math.sin(globalTime * 5 + l.offset) > 0) {
            ctx.fillStyle = l.color; ctx.fillRect(l.x, l.y, 2, 2);
        }
    });

    if (gameState !== 'GAMEOVER_ANIM') { pedestrians.forEach(p => p.draw(ctx)); vehicles.forEach(v => v.draw(ctx)); }
    
    fireZones.forEach(fz => fz.draw(ctx));
    shells.forEach(s => s.draw(ctx));
    powerups.forEach(p => p.draw(ctx));
    cannons.forEach(c => c.draw(ctx));
    enemies.forEach(e => e.draw(ctx));
    bombs.forEach(b => b.draw(ctx));
    birds.forEach(b => b.draw(ctx));
    feathers.forEach(f => f.draw(ctx));

    ctx.globalCompositeOperation = 'lighter';
    projectiles.forEach(p => p.draw(ctx));
    particles.forEach(p => p.draw(ctx));
    
    activeLasers.forEach(l => {
        ctx.strokeStyle = `rgba(0, 255, 255, ${l.life*5})`;
        ctx.lineWidth = 10;
        ctx.beginPath(); ctx.moveTo(l.x, l.y);
        ctx.lineTo(l.x + Math.cos(l.angle)*1500, l.y + Math.sin(l.angle)*1500);
        ctx.stroke();
        ctx.strokeStyle = `rgba(255, 255, 255, ${l.life*5})`;
        ctx.lineWidth = 4;
        ctx.stroke();
    });
    ctx.globalCompositeOperation = 'source-over';

    ctx.restore();
}

function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1; 
    lastTime = timestamp;
    
    if (gameState === 'PLAYING') { update(dt); draw(); } 
    else if (gameState === 'GAMEOVER_ANIM') { updateGameOverAnim(dt); draw(); }
    
    requestAnimationFrame(loop);
}

function startGame(e) {
    e.preventDefault(); e.stopPropagation();
    if (gameState === 'PLAYING' || gameState === 'GAMEOVER_ANIM') return; 
    try { Audio.init(); } catch(err) {}
    initGame();
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('gameOverScreen').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    gameState = 'PLAYING';
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('startBtn').addEventListener('touchend', startGame, {passive: false});
document.getElementById('restartBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('touchend', startGame, {passive: false});

resize();
requestAnimationFrame(loop);

</script>
</body>
</html>
